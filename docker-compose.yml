name: poulina-sso

services:

  # SQL Server 2022 
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: poulina-sso-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_SA_PASSWORD:-Poulina@SSO2026!}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: >
        /opt/mssql-tools18/bin/sqlcmd
        -S localhost -U sa -P "${DB_SA_PASSWORD:-Poulina@SSO2026!}"
        -Q "SELECT 1" -No
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # API .NET
  api:
    build:
      context: .
      dockerfile: API/Dockerfile
    image: poulina-sso-api:local
    container_name: poulina-sso-api
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "5095:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ConnectionStrings__DefaultConnection: >-
        Server=sqlserver,1433;
        Database=PoulinaSSODB;
        User Id=sa;
        Password=${DB_SA_PASSWORD:-Poulina@SSO2026!};
        TrustServerCertificate=True;
        MultipleActiveResultSets=true
      JwtSettings__SecretKey:         "${JWT_SECRET:-PoulinaSSO-SuperSecretKey-2026!@#$}"
      JwtSettings__Issuer:            "${JWT_ISSUER:-http://localhost:5095}"
      JwtSettings__Audience:          "${JWT_AUDIENCE:-http://localhost:5095}"
      JwtSettings__ExpirationMinutes: "15"
      JwtSettings__TokenLifetimeSecondes: "900"
      AppSettings__BaseUrl:           "${BASE_URL:-http://localhost:5095}"
      AppSettings__FrontendBaseUrl:   "${FRONTEND_URL:-http://localhost/sso}"
      Brevo__SmtpLogin:               "${BREVO_LOGIN}"
      Brevo__SmtpPassword:            "${BREVO_PASSWORD}"
      Brevo__ExpéditeurEmail:         "${BREVO_FROM_EMAIL:-noreply@poulina.com}"
      Brevo__ExpéditeurNom:           "${BREVO_FROM_NAME:-Poulina SSO}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  #  Node Exporter 
  node-exporter:
    image: prom/node-exporter:latest
    container_name: poulina-sso-node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: poulina-sso-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8081:8080"

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: poulina-sso-prometheus
    restart: unless-stopped
    depends_on:
      - api
      - node-exporter   
      - cadvisor        
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: poulina-sso-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: "smtp-relay.brevo.com:587"
      GF_SMTP_USER: "${BREVO_LOGIN}"
      GF_SMTP_PASSWORD: "${BREVO_PASSWORD}"
      GF_SMTP_FROM_ADDRESS: "${BREVO_FROM_EMAIL}"
      GF_SMTP_FROM_NAME: "${BREVO_FROM_NAME}"
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  sqlserver_data:
    name: poulina-sso-sqldata
  prometheus_data:
    name: poulina-sso-prometheus-data
  grafana_data:
    name: poulina-sso-grafana-data

networks:
  default:
    name: poulina-sso-network